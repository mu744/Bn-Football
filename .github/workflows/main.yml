name: Build BN-Football APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      - name: Télécharger BN-Football
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            gcc \
            g++ \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            make \
            ninja-build \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      - name: Configurer Android SDK
        run: |
          set -e

          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "Android SDK introuvable."
            exit 1
          fi

          echo "SDK utilisé : $SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Installer Android API 35 et NDK
        run: |
          set -e

          SDKMANAGER="$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Configurer le NDK
        run: |
          set -e

          NDK="$ANDROIDSDK/ndk/28.2.13676358"

          test -d "$NDK"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "NDK utilisé : $NDK"

      - name: Vérifier les outils
        run: |
          set -e

          java -version
          python --version
          cmake --version
          ninja --version
          autoconf --version
          automake --version
          libtool --version

          test -d "$ANDROIDSDK/platforms/android-35"
          test -d "$ANDROIDSDK/build-tools/35.0.0"
          test -d "$ANDROIDNDK"

          echo "Environnement prêt."

      - name: Installer Python-for-Android
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            python-for-android==2026.05.09

          p4a --version

      - name: Construire BN-Football
        run: |
          set -e

          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package=com.bndigital.football \
            --name="BN-Football" \
            --version=1.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3==3.13.7,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=26 \
            --ndk-dir="$ANDROIDNDK" \
            --sdk-dir="$ANDROIDSDK" \
            --orientation=landscape \
            --debug

      - name: Préparer l'APK
        run: |
          set -e

          mkdir -p output

          APK=""

          while IFS= read -r file; do
            APK="$file"
            break
          done < <(find . -type f -name "*.apk")

          if [ -z "$APK" ]; then
            echo "Aucun APK généré."
            exit 1
          fi

          echo "APK trouvé : $APK"

          cp "$APK" output/BN-Football.apk

          test -f output/BN-Football.apk

          ls -lh output/BN-Football.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: BN-Football-APK
          path: output/BN-Football.apk
          if-no-files-found: error

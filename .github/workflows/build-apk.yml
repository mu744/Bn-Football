name: Build BN-Football APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      - name: Détecter Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERREUR : Android SDK introuvable."
            exit 1
          fi

          echo "SDK détecté : $SDK"

          test -d "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Vérifier Android API 35
        shell: bash
        run: |
          set -e

          test -d "$ANDROIDSDK/platforms/android-35"

          echo "Android API 35 : OK"

      - name: Détecter Build Tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROIDSDK/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "35.*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERREUR : Build Tools 35 introuvables."
            exit 1
          fi

          echo "Build Tools : $BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Détecter NDK r28c
        shell: bash
        run: |
          set -e

          NDK=$(find "$ANDROIDSDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "28.2.*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$NDK" ]; then
            echo "ERREUR : NDK r28c introuvable."
            exit 1
          fi

          echo "NDK sélectionné : $NDK"

          test -f "$NDK/source.properties"

          grep "Pkg.Revision" "$NDK/source.properties"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Vérification complète
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== AUTOCONF ====="
          autoconf --version | head -n 1

          echo "===== AUTOMAKE ====="
          automake --version | head -n 1

          echo "===== LIBTOOL ====="
          libtool --version | head -n 1

          echo "===== CMAKE ====="
          cmake --version | head -n 1

          echo "===== NINJA ====="
          ninja --version

          echo "===== SDK ====="
          echo "$ANDROIDSDK"

          echo "===== API ====="
          test -d "$ANDROIDSDK/platforms/android-35"

          echo "===== BUILD TOOLS ====="
          test -d "$BUILD_TOOLS"

          echo "===== NDK ====="
          echo "$ANDROIDNDK"

          echo "===== NDK VERSION ====="
          grep "Pkg.Revision" "$ANDROIDNDK/source.properties"

          echo "================================"
          echo "CONFIGURATION COMPLETE : OK"
          echo "================================"

      - name: Installer Python-for-Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install python-for-android==2026.05.09
          p4a --version

      - name: Vérifier BN-Football
        shell: bash
        run: |
          set -e

          test -f main.py
          test -d football
          test -d core

          echo "main.py : OK"
          echo "football/ : OK"
          echo "core/ : OK"
          echo "Projet BN-Football : OK"

      - name: Construire BN-Football APK
        shell: bash
        run: |
          set -e

          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package=com.bndigital.football \
            --name="BN-Football" \
            --version=1.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=26 \
            --ndk-dir="$ANDROIDNDK" \
            --sdk-dir="$ANDROIDSDK" \
            --orientation=landscape \
            --debug

      - name: Trouver et préparer l'APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          echo "Recherche de l'APK..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          cp "$APK" output/BN-Football.apk

          echo "APK FINAL :"
          ls -lh output/BN-Football.apk

      - name: Publier BN-Football APK
        uses: actions/upload-artifact@v4
        with:
          name: BN-Football-APK
          path: output/BN-Football.apk
          if-no-files-found: error

name: Build BN-Football APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    env:
      SDK_ROOT: /usr/local/lib/android/sdk
      NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

    steps:

      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurer Android SDK et NDK
        run: |
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Vérifier toute la configuration Android
        run: |
          echo "===== SDK ====="
          test -d "$SDK_ROOT"
          echo "SDK OK"

          echo "===== API 35 ====="
          test -d "$SDK_ROOT/platforms/android-35"
          echo "API 35 OK"

          echo "===== BUILD TOOLS ====="
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "Build-tools 35.0.0 OK"

          echo "===== NDK ====="
          test -d "$NDK_ROOT"
          echo "NDK OK"

          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== CMAKE ====="
          cmake --version

          echo "===== SDKMANAGER ====="
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Installer Python-for-Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install python-for-android==2026.05.09

      - name: Nettoyer les anciens builds
        run: |
          rm -rf .p4a
          rm -rf ~/.local/share/python-for-android
          rm -rf ~/.cache/python-for-android

      - name: Construire BN-Football APK
        run: |
          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package=com.bndigital.football \
            --name="BN-Football" \
            --version=1.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=26 \
            --ndk-dir="$NDK_ROOT" \
            --sdk-dir="$SDK_ROOT" \
            --orientation=landscape \
            --debug

      - name: Chercher l'APK
        run: |
          mkdir -p output
          find . -type f -name "*.apk" -print
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" output/BN-Football.apk
          ls -lh output/BN-Football.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: BN-Football-APK
          path: output/BN-Football.apk
          if-no-files-found: error

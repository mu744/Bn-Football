name: Build BN-Football APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      # =========================================================
      # 1. PROJET
      # =========================================================

      - name: Télécharger le projet
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. PYTHON
      # =========================================================

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 4. DEPENDANCES LINUX POUR P4A
      # =========================================================

      - name: Installer les dépendances de compilation
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip


      # =========================================================
      # 5. DETECTION DU SDK ANDROID
      # =========================================================

      - name: Détecter Android SDK
        shell: bash
        run: |
          set -e

          echo "Recherche du SDK Android..."

          if [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "ERREUR : Android SDK introuvable."
            exit 1
          fi

          echo "SDK détecté : $SDK"

          test -d "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # =========================================================
      # 6. VERIFICATION API 35
      # =========================================================

      - name: Vérifier Android API 35
        shell: bash
        run: |
          set -e

          echo "Vérification Android API 35..."

          test -d "$ANDROIDSDK/platforms/android-35"

          echo "Android API 35 : OK"


      # =========================================================
      # 7. DETECTION BUILD TOOLS
      # =========================================================

      - name: Détecter Build Tools
        shell: bash
        run: |
          set -e

          echo "Build Tools disponibles :"

          ls -1 "$ANDROIDSDK/build-tools"

          BUILD_TOOLS=$(find "$ANDROIDSDK/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "35.*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERREUR : Build Tools 35 introuvables."
            exit 1
          fi

          echo "Build Tools sélectionnés : $BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"


      # =========================================================
      # 8. DETECTION NDK r28c
      # =========================================================

      - name: Détecter NDK r28c
        shell: bash
        run: |
          set -e

          echo "NDK disponibles :"

          find "$ANDROIDSDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V || true

          NDK=$(find "$ANDROIDSDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "28.2.*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$NDK" ]; then
            echo "ERREUR : NDK r28c introuvable."
            exit 1
          fi

          echo "NDK sélectionné : $NDK"

          test -f "$NDK/source.properties"

          echo "Version NDK :"
          grep "Pkg.Revision" "$NDK/source.properties"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"


      # =========================================================
      # 9. VERIFICATION COMPLETE
      # =========================================================

      - name: Vérification complète de la chaîne Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        BN-FOOTBALL BUILD CHECK"
          echo "======================================"

          echo ""
          echo "JAVA"
          java -version

          echo ""
          echo "PYTHON"
          python --version

          echo ""
          echo "PIP"
          pip --version

          echo ""
          echo "AUTOCONF"
          autoconf --version | head -n 1

          echo ""
          echo "AUTOMAKE"
          automake --version | head -n 1

          echo ""
          echo "LIBTOOL"
          libtool --version | head -n 1

          echo ""
          echo "CMAKE"
          cmake --version | head -n 1

          echo ""
          echo "NINJA"
          ninja --version

          echo ""
          echo "ANDROID SDK"
          echo "$ANDROIDSDK"

          echo ""
          echo "ANDROID API"
          test -d "$ANDROIDSDK/platforms/android-35"
          echo "API 35 OK"

          echo ""
          echo "BUILD TOOLS"
          echo "$BUILD_TOOLS"

          echo ""
          echo "ANDROID NDK"
          echo "$ANDROIDNDK"

          echo ""
          echo "NDK VERSION"
          grep "Pkg.Revision" "$ANDROIDNDK/source.properties"

          echo ""
          echo "======================================"
          echo "TOUS LES COMPOSANTS SONT PRESENTS"
          echo "======================================"


      # =========================================================
      # 10. P4A
      # =========================================================

      - name: Installer python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            python-for-android==2026.05.09

          p4a --version


      # =========================================================
      # 11. VERIFICATION DU PROJET
      # =========================================================

      - name: Vérifier BN-Football
        shell: bash
        run: |
          set -e

          test -f main.py

          echo "main.py : OK"

          test -d football

          echo "football/ : OK"

          test -d core

          echo "core/ : OK"

          echo "Projet BN-Football prêt."


      # =========================================================
      # 12. CONSTRUCTION APK
      # =========================================================

      - name: Construire BN-Football APK
        shell: bash
        run: |
          set -e

          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package=com.bndigital.football \
            --name="BN-Football" \
            --version=1.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=26 \
            --ndk-dir="$ANDROIDNDK" \
            --sdk-dir="$ANDROIDSDK" \
            --orientation=landscape \
            --debug


      # =========================================================
      # 13. RECHERCHE APK
      # =========================================================

      - name: Trouver APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          echo "Recherche de tous les APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo "APK trouvé : $APK"

          cp "$APK" output/BN-Football.apk

          echo ""
          echo "APK FINAL :"

          ls -lh output/BN-Football.apk


      # =========================================================
      # 14. PUBLIER APK
      # =========================================================

      - name: Publier BN-Football APK
        uses: actions/upload-artifact@v4
        with:
          name: BN-Football-APK
          path: output/BN-Football.apk
          if-no-files-found: error

name: Build BN-Football APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances Linux p4a
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            cmake \
            ninja-build \
            make \
            gcc \
            g++ \
            git \
            patch \
            unzip \
            zip \
            wget \
            lbzip2 \
            ccache

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_SDK_ROOT"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Détecter le NDK
        run: |
          SDK="$ANDROID_SDK_ROOT"

          echo "NDK disponibles :"
          find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V

          NDK=$(find "$SDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name "28.*" \
            | sort -V \
            | tail -n 1)

          test -n "$NDK"
          test -d "$NDK"

          echo "NDK sélectionné : $NDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Vérifier la chaîne de compilation
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== AUTOCONF ====="
          autoconf --version | head -n 1

          echo "===== LIBTOOL ====="
          libtool --version | head -n 1

          echo "===== CMAKE ====="
          cmake --version | head -n 1

          echo "===== SDK ====="
          test -d "$ANDROIDSDK/platforms/android-35"

          echo "===== BUILD TOOLS ====="
          test -d "$ANDROIDSDK/build-tools/35.0.0"

          echo "===== NDK ====="
          test -d "$ANDROIDNDK"

          echo "CONFIGURATION ANDROID OK"

      - name: Installer Python-for-Android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install python-for-android==2026.05.09

      - name: Construire BN-Football APK
        run: |
          p4a apk \
            --private "$GITHUB_WORKSPACE" \
            --package=com.bndigital.football \
            --name="BN-Football" \
            --version=1.0.0 \
            --bootstrap=sdl2 \
            --requirements=python3,pygame \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=26 \
            --ndk-dir="$ANDROIDNDK" \
            --sdk-dir="$ANDROIDSDK" \
            --orientation=landscape \
            --debug

      - name: Vérifier et préparer APK
        run: |
          mkdir -p output

          echo "Recherche de l'APK..."
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          cp "$APK" output/BN-Football.apk

          echo "APK FINAL :"
          ls -lh output/BN-Football.apk

      - name: Publier BN-Football APK
        uses: actions/upload-artifact@v4
        with:
          name: BN-Football-APK
          path: output/BN-Football.apk
          if-no-files-found: error
